# Microseconds per operation, measured on an Apple M-series laptop in release
# mode. These are a floor for "has something stopped being linear", not a
# promise about any particular machine — CI runners are slower and noisier,
# which is why the tolerance is generous.
#
# Regenerate with `cargo run --release --bin rsst-bench` and paste the measured
# column here, but only when the change is understood and intended.

# A GitHub runner is several times slower than a development laptop and noisy
# with it, so the tolerance is wide on purpose. It is sized to catch an
# operation that has stopped being linear, not one that is 20% slower.
tolerance = 6.0

parse_500_entries = 1920.0
wrap_10k_chars = 48.0
sort_5000_entries = 18.0
# Was 4900 when a refresh deleted every row for the feed and inserted them all
# again. It writes only what changed now, and a refresh of an unchanged feed
# writes nothing — so the old number would let a return to the rewrite pass
# unnoticed at 1.0x.
refresh_one_of_50_feeds = 105.0
search_5000_entries = 540.0
