# A fully populated rsst config. Every key below is optional except the feed
# URLs; the values shown are the defaults unless noted.
#
# Location:
#   macOS    ~/Library/Application Support/rsst/config.toml
#   Linux    ~/.config/rsst/config.toml
#   Windows  %APPDATA%\rsst\config.toml

# How many feeds may be fetched at once. Default: 8.
max_concurrent_fetches = 8

# The most a single feed may send, in megabytes. Default: 8. Zero means the
# default. A server that sends more than this is hung up on rather than
# believed — without a limit, how much memory rsst uses is the server's choice.
max_feed_megabytes = 8

# How many times to try again after a failure that might not repeat — a
# timeout, an unreachable host, a 5xx. Default: 2, capped at 5. Zero never
# retries. A 404 or a document that is not a feed is never retried whatever
# this says, because asking again cannot change the answer.
retry_attempts = 2

# The widest line of prose, in columns. Default: 72. Zero uses the whole pane.
#
# Long lines are hard to read for a mechanical reason: at the end of one the eye
# has to travel back to find the start of the next, and the further it travels
# the more often it lands on the wrong line. Code is exempt — its line breaks
# belong to whoever wrote it.
measure = 72

# How often to refresh, in minutes. Default: 30. Zero turns the timer off and
# leaves refreshing to `r`. Conditional requests mean an unchanged feed costs a
# few hundred bytes, and a server that asks us to back off is always obeyed
# whatever this says.
refresh_minutes = 30

# Whether rsst captures the mouse. Default: true — click a feed or an entry to
# select it, click a group heading to fold it, click a link to open it, and roll
# the wheel over any pane to scroll it.
#
# The trade-off is that while rsst holds the mouse, your terminal cannot use it
# for selecting text. Most terminals — Ghostty, iTerm2, kitty, Alacritty —
# hand selection back if you hold Shift while dragging. Set this to false if you
# would rather have ordinary selection all the time.
mouse = true

# ─── Feeds ───────────────────────────────────────────────────────────────────
# Repeat [[feeds]] once per subscription. `url` is required; the rest optional.

[[feeds]]
url = "https://blog.rust-lang.org/feed.xml"
# Overrides the title the feed advertises. Default: the feed's own title,
# falling back to the URL.
title = "Rust Blog"
# The feed's folder path in the sidebar, outermost first. Default: the top
# level. It is a path, not a set of labels: ["Rust", "Core"] puts the feed in
# Core, inside Rust. OPML folders import as paths, and export back to folders.
#
# You can also move a feed from inside the reader with `M`, which rewrites this
# line and leaves the rest of the file — comments included — alone.
tags = ["Rust", "Core"]
# Overrides the global interval for this feed alone. Default: the global one.
refresh_minutes = 15

[[feeds]]
url = "https://this-week-in-rust.org/atom.xml"

# ─── Colours ─────────────────────────────────────────────────────────────────
# rsst says what a thing *is* and lets the terminal say what colour that is.
# The presets use only the sixteen ANSI colours, which every terminal theme
# remaps — so rsst follows your Ghostty/iTerm2/Alacritty theme rather than
# fighting it. Setting NO_COLOR disables colour whatever this says.

[theme]
# "terminal" (default) follows your palette and uses attributes for emphasis.
# "dark" is the bright half of the palette, "light" the dim half, and "mono"
# uses no colour at all.
name = "terminal"

# Draw borders and markers with ASCII instead of box-drawing characters.
# Unset means detect: ASCII is used when TERM is `dumb` or unset, or when the
# locale is not UTF-8. Set it explicitly to override the detection either way.
ascii = false

# Any role can be overridden. A value is a colour, one or more attributes, or
# both — "bold cyan". Naming no colour is deliberate: the role then follows
# whatever foreground your terminal is using, which is what keeps `dim` from
# vanishing into a background it was never told about.
#
#   colours     black red green yellow blue magenta cyan white gray darkgray
#               lightred lightgreen lightyellow lightblue lightmagenta lightcyan
#               default (your terminal's own foreground), or #rrggbb
#   attributes  bold dim italic underline reverse
accent = "cyan"             # focused borders, unread counts, the selection
dim = "dim"                 # dates, read entries, anything receding
error = "red"               # feeds that failed to fetch
warning = "yellow"          # prompts waiting for an answer
star = "yellow"             # starred entries
group = "bold magenta"      # feed group headings
link = "underline blue"     # the link in the detail pane

# The status bar is not listed: it reverses whichever role it is carrying, so
# its text colour is your terminal's own background and it contrasts by
# construction rather than by guess.

# ─── Keys ────────────────────────────────────────────────────────────────────
# Rebind any action. An override REPLACES the default, so binding `quit` to `x`
# means `q` no longer quits. Anything left out keeps its default.
#
# Key spelling: a single character (`j`, `A`, `?`), a named key (`tab`, `enter`,
# `space`, `esc`, `backspace`, `up`, `down`, `left`, `right`, `home`, `end`,
# `pageup`, `pagedown`), optionally prefixed `ctrl-` or `alt-`.
#
# Run `rsst --help`, or press `?` in the app, for the current bindings.

[keys]
next = "j"                        # next item, or scroll the detail pane
previous = "k"                    # previous item, or scroll back
first = "g"                       # first item
last = "G"                        # last item
half_page_down = "ctrl-d"         # half a pane down
half_page_up = "ctrl-u"           # half a pane up
cycle_pane = "tab"                # cycle feeds / entries / detail
toggle_group = "enter"            # fold a feed group away
next_unread = "n"                 # next unread, across feeds
previous_unread = "p"             # previous unread
toggle_read = "m"                 # toggle read on this entry
mark_feed_read = "a"              # mark this feed read (asks first)
mark_all_read = "A"               # mark every feed read (asks first)
toggle_unread_only = "u"          # show only unread
toggle_star = "s"                 # star this entry
toggle_starred_view = "S"         # show only starred
toggle_all_feeds = "v"            # show every feed as one list
toggle_sort = "t"                 # oldest first / newest first
toggle_reading = "z"              # give the article the whole screen
fetch_article = "f"               # fetch the full article behind a teaser
search = "/"                      # search every feed
open = "o"                        # open the entry in your browser
copy_link = "y"                   # copy its link
refresh = "r"                     # refresh all feeds
reload_config = "R"               # re-read this file
help = "?"                        # show the key reference
quit = "q"                        # quit
