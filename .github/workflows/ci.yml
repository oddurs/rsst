name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # An advisory published against an unchanged tree would otherwise go unnoticed
  # until someone happened to push.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  cross:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # SQLite is vendored C, so this target needs a cross C compiler as well
      # as a cross linker. Proven here rather than at tag time, where a broken
      # release target is discovered by failing to cut a release.
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc'
            echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc'
          } >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}

  backlog:
    name: cairn check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned: a schema change should be a deliberate commit, not something a
      # new cairn release does to us mid-PR.
      - name: Install cairn
        env:
          CAIRN_VERSION: "0.2.0"
        run: |
          url="https://github.com/oddurs/cairn/releases/download/v${CAIRN_VERSION}/cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" | tar xz --strip-components=1 -C /usr/local/bin "cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl/cairn"
          cairn --version
      - name: Every item matches the schema
        run: cairn check
      # ROADMAP.md is generated. If it does not match the items, someone edited
      # the wrong file or forgot to render.
      - name: ROADMAP.md is up to date
        run: |
          cairn render -q
          git diff --exit-code -- ROADMAP.md || {
            echo "::error::ROADMAP.md is stale — run 'cairn render' and commit the result"
            exit 1
          }

  fuzz:
    name: fuzz the parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release mode: the corpus and its mutations are the point, and a debug
      # build spends the budget on being slow rather than on inputs.
      - run: cargo test --release --test fuzz
        env:
          RSST_FUZZ_ITERATIONS: 20000

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails only when an operation is several times slower than its committed
      # baseline — enough to catch something that has stopped being linear,
      # loose enough not to flag a slow or noisy runner.
      - run: cargo run --release --bin rsst-bench

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A prebuilt binary, rather than rustsec/audit-check: that action spends
      # three minutes compiling cargo-audit from source and needs `checks: write`
      # to publish its results.
      - uses: taiki-e/install-action@cargo-audit
      # Vulnerabilities fail the build. Informational advisories (unmaintained,
      # unsound) are reported but don't, since they usually land on transitive
      # deps we can't patch on our own schedule.
      - run: cargo audit
