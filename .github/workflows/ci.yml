name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  backlog:
    name: cairn check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned: a schema change should be a deliberate commit, not something a
      # new cairn release does to us mid-PR.
      - name: Install cairn
        env:
          CAIRN_VERSION: "0.2.0"
        run: |
          url="https://github.com/oddurs/cairn/releases/download/v${CAIRN_VERSION}/cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" | tar xz --strip-components=1 -C /usr/local/bin "cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl/cairn"
          cairn --version
      - name: Every item matches the schema
        run: cairn check
      # ROADMAP.md is generated. If it does not match the items, someone edited
      # the wrong file or forgot to render.
      - name: ROADMAP.md is up to date
        run: |
          cairn render -q
          git diff --exit-code -- ROADMAP.md || {
            echo "::error::ROADMAP.md is stale — run 'cairn render' and commit the result"
            exit 1
          }

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A prebuilt binary, rather than rustsec/audit-check: that action spends
      # three minutes compiling cargo-audit from source and needs `checks: write`
      # to publish its results.
      - uses: taiki-e/install-action@cargo-audit
      # Vulnerabilities fail the build. Informational advisories (unmaintained,
      # unsound) are reported but don't, since they usually land on transitive
      # deps we can't patch on our own schedule.
      - run: cargo audit
